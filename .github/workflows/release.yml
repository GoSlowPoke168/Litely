name: Release

# A version tag (v1.2.3) builds the installer, portable zip and samples zip and opens a draft release.
# Run it by hand from the Actions tab to build the same files as a downloadable artifact, with no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $rc = Select-String -Path litely.rc -Pattern '"ProductVersion", "([^"]+)"'
          $version = $rc.Matches[0].Groups[1].Value
          if ($version -ne $tag) { throw "litely.rc says $version but the tag is v$tag" }

      # The sample videos aren't in the repository; they come from the latest release's Litely-samples.zip.
      - name: Get the sample videos
        shell: pwsh
        run: |
          gh release download --repo "${{ github.repository }}" --pattern Litely-samples.zip --dir build
          Expand-Archive build\Litely-samples.zip -DestinationPath build\samples -Force
          Remove-Item build\Litely-samples.zip
          Get-ChildItem build\samples | Format-Table Name, Length

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build
        shell: cmd
        run: installer\build.cmd

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem build\installer\Litely-Setup.exe, build\installer\Litely-portable.zip, build\installer\Litely-samples.zip |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } |
            Set-Content build\installer\SHA256SUMS.txt
          Get-Content build\installer\SHA256SUMS.txt

      - name: Upload the build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: litely-build
          path: |
            build/installer/Litely-Setup.exe
            build/installer/Litely-portable.zip
            build/installer/Litely-samples.zip
            build/installer/SHA256SUMS.txt

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $sums = Get-Content build\installer\SHA256SUMS.txt -Raw
          $notes = "Write the changes here before publishing.`n`n## Checksums (SHA-256)`n`n``````n$sums``````"
          $title = 'Litely ' + "${{ github.ref_name }}".TrimStart('v')
          gh release create "${{ github.ref_name }}" build\installer\Litely-Setup.exe build\installer\Litely-portable.zip build\installer\Litely-samples.zip `
            --repo "${{ github.repository }}" --draft --title $title --notes $notes
